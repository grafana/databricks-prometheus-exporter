# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/grafana/databricks-prometheus-exporter
    gofumpt:
      extra-rules: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - depguard
  settings:
    gosec:
      severity: medium
      confidence: medium

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - mixin
    - vendor
